[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hahai85-augmentdiv"
version = "0.1.0"
description = "比较增强前后样本的分布与近重复率，标出无效的增强"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "hahai85" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://hahai85.github.io"
Repository = "https://github.com/hahai85/augmentdiv"
Issues = "https://github.com/hahai85/augmentdiv/issues"

[project.scripts]
augmentdiv = "augmentdiv:main"

[tool.setuptools]
py-modules = ["augmentdiv"]
